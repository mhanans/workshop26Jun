<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo App — Playwright Workshop</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; max-width: 460px; margin: 60px auto; color: #0f172a; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
  input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; }
  select { padding: 6px; margin-top: 4px; font-size: 13px; }
  button { margin-top: 18px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; font-weight: normal; margin-top: 12px; }
  .checkbox-row input { width: auto; margin: 0; }
  #login-error { color: #b91c1c; margin-top: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .toolbar label { margin-top: 0; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
  [hidden] { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>
<body>

  <main id="login-view">
    <h1>Please Login</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">

      <label class="checkbox-row">
        <input type="checkbox" id="remember-me"> Remember me
      </label>

      <button type="submit">Login</button>
    </form>
    <p id="login-error" role="alert" hidden></p>
  </main>

  <main id="inventory-view" hidden>
    <header>
      <h1>Products</h1>
      <div>Cart: <span data-testid="cart-badge">0</span></div>
    </header>

    <div class="toolbar">
      <div>
        <label for="search-input" class="sr-only">Search products</label>
        <input id="search-input" type="text" placeholder="Search products...">
      </div>
      <div>
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="name-asc">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
        </select>
      </div>
    </div>

    <ul id="product-list">
      <li data-name="Backpack" data-order="1">
        <span>Backpack</span>
        <!-- Deeply nested on purpose — Module 5's "brittle XPath" demo target.
             Add/remove a wrapper here and any absolute-path locator breaks;
             get_by_role(...) keeps working regardless. -->
        <div><div><section><div><span>
          <button data-product="backpack">Add Backpack to cart</button>
        </span></div></section></div></div>
      </li>
      <li data-name="Bike Light" data-order="2">
        <span>Bike Light</span>
        <button data-product="bike-light">Add Bike Light to cart</button>
      </li>
    </ul>
    <button id="logout-btn">Logout</button>
  </main>

<script>
  var VALID_USERS = { standard_user: "secret_sauce", locked_out_user: "secret_sauce" };
  var cartCount = 0;

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    var errorEl = document.getElementById("login-error");
    errorEl.hidden = true;

    if (username === "locked_out_user") {
      errorEl.textContent = "Sorry, this user has been locked out.";
      errorEl.hidden = false;
      return;
    }

    if (VALID_USERS[username] === password) {
      document.getElementById("login-view").hidden = true;
      document.getElementById("inventory-view").hidden = false;
      history.replaceState(null, "", "#/inventory.html");
      return;
    }

    errorEl.textContent = "Username and password do not match.";
    errorEl.hidden = false;
  });

  document.getElementById("product-list").addEventListener("click", function (e) {
    if (e.target.matches("button[data-product]")) {
      cartCount++;
      document.querySelector('[data-testid="cart-badge"]').textContent = String(cartCount);
    }
  });

  document.getElementById("sort-select").addEventListener("change", function (e) {
    var list = document.getElementById("product-list");
    var items = Array.prototype.slice.call(list.querySelectorAll("li"));
    var dir = e.target.value;
    if (dir === "name-asc") {
      items.sort(function (a, b) { return a.dataset.name.localeCompare(b.dataset.name); });
    } else if (dir === "name-desc") {
      items.sort(function (a, b) { return b.dataset.name.localeCompare(a.dataset.name); });
    } else {
      items.sort(function (a, b) { return Number(a.dataset.order) - Number(b.dataset.order); });
    }
    items.forEach(function (li) { list.appendChild(li); });
  });

  document.getElementById("search-input").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var term = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#product-list li").forEach(function (li) {
      var match = !term || li.dataset.name.toLowerCase().indexOf(term) !== -1;
      li.hidden = !match;
    });
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    document.getElementById("inventory-view").hidden = true;
    document.getElementById("login-view").hidden = false;
    document.getElementById("login-form").reset();
    document.getElementById("login-error").hidden = true;
    document.getElementById("search-input").value = "";
    document.querySelectorAll("#product-list li").forEach(function (li) { li.hidden = false; });
    cartCount = 0;
    document.querySelector('[data-testid="cart-badge"]').textContent = "0";
    history.replaceState(null, "", "#/login.html");
  });
</script>
</body>
</html>
